<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#16171a"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a424a"/>
      <stop offset="0.22" stop-color="#c9d1d8"/>
      <stop offset="0.38" stop-color="#f4f6f8"/>
      <stop offset="0.7" stop-color="#8a959f"/>
      <stop offset="1" stop-color="#262c32"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b8c1c9"/>
      <stop offset="1" stop-color="#4a535c"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14181c"/>
      <stop offset="0.3" stop-color="#8a96a2"/>
      <stop offset="0.5" stop-color="#4c5660"/>
      <stop offset="1" stop-color="#111417"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e2328"/>
      <stop offset="0.35" stop-color="#e4e9ee"/>
      <stop offset="1" stop-color="#2a3036"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab4be"/>
      <stop offset="0.4" stop-color="#5c6772"/>
      <stop offset="1" stop-color="#1a1e23"/>
    </linearGradient>
    <radialGradient id="mouth" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.25" stop-color="#f8cf66"/>
      <stop offset="0.6" stop-color="#6e4410"/>
      <stop offset="1" stop-color="#140f08"/>
    </radialGradient>
    <linearGradient id="goldwin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2bf"/>
      <stop offset="0.5" stop-color="#f2c055"/>
      <stop offset="1" stop-color="#9a6214"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c6f66"/>
      <stop offset="0.5" stop-color="#46e0c8"/>
      <stop offset="1" stop-color="#1c6f66"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur7" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="mouthclip"><ellipse cx="128" cy="82" rx="74" ry="20"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <g transform="translate(128 128) scale(0.915) translate(-127.5 -110)">
  <ellipse cx="128" cy="228" rx="104" ry="11" fill="#000" opacity="0.85" filter="url(#blur3)"/>

  <!-- ===== compressed gas tanks flanking the compressor ===== -->
  <g id="tankL">
    <rect x="22" y="118" width="46" height="102" rx="12" fill="url(#tank)"/>
    <ellipse cx="45" cy="122" rx="23" ry="7" fill="#9aa5b0"/>
    <ellipse cx="45" cy="122" rx="12" ry="3.4" fill="#3a434c"/>
    <rect x="22" y="134" width="46" height="7" fill="url(#band)"/>
    <rect x="22" y="200" width="46" height="7" fill="url(#band)"/>
    <rect x="36" y="148" width="18" height="44" rx="8" fill="#0d0f12"/>
    <rect x="38" y="150" width="14" height="40" rx="7" fill="url(#goldwin)"/>
    <rect x="34" y="146" width="22" height="48" rx="10" fill="#ffd56e" opacity="0.35" filter="url(#blur3)"/>
    <path d="M41 154 L41 170" stroke="#fffbe8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
  <g>
    <rect x="188" y="118" width="46" height="102" rx="12" fill="url(#tank)"/>
    <ellipse cx="211" cy="122" rx="23" ry="7" fill="#9aa5b0"/>
    <ellipse cx="211" cy="122" rx="12" ry="3.4" fill="#3a434c"/>
    <rect x="188" y="134" width="46" height="7" fill="url(#band)"/>
    <rect x="188" y="200" width="46" height="7" fill="url(#band)"/>
    <rect x="202" y="148" width="18" height="44" rx="8" fill="#0d0f12"/>
    <rect x="204" y="150" width="14" height="40" rx="7" fill="url(#goldwin)"/>
    <rect x="200" y="146" width="22" height="48" rx="10" fill="#ffd56e" opacity="0.35" filter="url(#blur3)"/>
    <path d="M207 154 L207 170" stroke="#fffbe8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- feed pipes -->
  <path d="M68 184 L96 184 M160 184 L188 184" stroke="#0e1114" stroke-width="12"/>
  <path d="M68 184 L96 184 M160 184 L188 184" stroke="url(#box)" stroke-width="8"/>
  <path d="M68 181 L96 181 M160 181 L188 181" stroke="#e8edf2" stroke-width="1.5" opacity="0.7"/>

  <!-- ===== compressor block ===== -->
  <rect x="90" y="150" width="76" height="66" rx="8" fill="#0d1014"/>
  <rect x="92" y="152" width="72" height="62" rx="7" fill="url(#box)"/>
  <g stroke="#1b2026" stroke-width="3">
    <path d="M100 168 L156 168"/><path d="M100 176 L156 176"/><path d="M100 184 L156 184"/><path d="M100 192 L156 192"/>
  </g>
  <g stroke="#dfe5eb" stroke-width="1" opacity="0.6">
    <path d="M100 166 L156 166"/><path d="M100 174 L156 174"/><path d="M100 182 L156 182"/><path d="M100 190 L156 190"/>
  </g>
  <rect x="100" y="200" width="56" height="6" rx="2" fill="url(#teal)"/>
  <circle cx="104" cy="160" r="2.4" fill="#46e0c8"/><circle cx="152" cy="160" r="2.4" fill="#ffb84d"/>

  <!-- ===== wide intake scoop ===== -->
  <!-- cone -->
  <path d="M50 82 C70 112 96 136 106 152 L150 152 C160 136 186 112 206 82 Z" fill="url(#ceramic)"/>
  <!-- cone ribs converging on the throat -->
  <g fill="none" stroke="#3e4750" stroke-width="3">
    <path d="M78 98 C92 120 104 136 112 152"/>
    <path d="M128 102 L128 152"/>
    <path d="M178 98 C164 120 152 136 144 152"/>
  </g>
  <path d="M80 97 C93 118 104 134 111 148" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- throat collar -->
  <rect x="102" y="146" width="52" height="10" rx="3" fill="url(#band)" stroke="#0e1114" stroke-width="1.5"/>
  <!-- mouth -->
  <ellipse cx="128" cy="82" rx="80" ry="25" fill="#0e1114"/>
  <ellipse cx="128" cy="82" rx="74" ry="20" fill="url(#mouth)"/>
  <!-- intake vanes inside the mouth -->
  <g clip-path="url(#mouthclip)" fill="none" stroke-width="2.2">
    <ellipse cx="128" cy="86" rx="52" ry="13" stroke="#2a1c0a" opacity="0.85"/>
    <ellipse cx="128" cy="89" rx="30" ry="7.5" stroke="#4a300c" opacity="0.8"/>
    <path d="M60 84 L104 88 M196 84 L152 88 M128 64 L128 80" stroke="#2a1c0a" opacity="0.8"/>
  </g>
  <!-- rim -->
  <ellipse cx="128" cy="82" rx="77" ry="22.5" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <path d="M66 70 C86 61 108 58 128 58" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="128" cy="82" rx="80.5" ry="26" fill="none" stroke="#0e1114" stroke-width="1.5"/>
  <g fill="#3a434c">
    <circle cx="50" cy="82" r="2.2"/><circle cx="206" cy="82" r="2.2"/><circle cx="84" cy="102" r="2.2"/><circle cx="172" cy="102" r="2.2"/><circle cx="128" cy="105" r="2.2"/>
  </g>

  <!-- ===== glowing tibanna gas spiralling down into the scoop ===== -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 30 C70 14 186 12 214 28 C226 36 200 46 160 48" stroke="#ffd56e" stroke-width="14" opacity="0.6" filter="url(#blur7)"/>
    <path d="M40 30 C70 14 186 12 214 28 C226 36 200 46 160 48" stroke="#fff0bc" stroke-width="5" opacity="0.95" filter="url(#blur1)"/>
    <path d="M196 40 C176 52 92 54 76 46 C66 40 96 34 128 36" stroke="#ffe39a" stroke-width="4.4" opacity="0.9" filter="url(#blur1)"/>
    <path d="M160 48 C140 50 104 54 100 60 C98 66 120 68 140 66" stroke="#fff4cc" stroke-width="4.6" opacity="0.95" filter="url(#blur1)"/>
    <path d="M128 36 C150 38 162 46 150 56 C142 62 124 64 118 72" stroke="#fff8dc" stroke-width="3.6" opacity="0.95" filter="url(#blur1)"/>
    <path d="M128 28 L128 78" stroke="#ffd56e" stroke-width="26" opacity="0.5" filter="url(#blur7)"/>
  </g>
  <g fill="#fff6d8">
    <circle cx="58" cy="20" r="2"/><circle cx="196" cy="16" r="1.8"/><circle cx="100" cy="44" r="1.6"/><circle cx="170" cy="58" r="1.6"/><circle cx="84" cy="58" r="1.4"/><circle cx="150" cy="24" r="1.5"/>
  </g>
  </g>
</svg>
