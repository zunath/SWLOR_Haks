name: Portrait companion

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            sw_portrait
            sw_2da
            tools
            portrait-viewer
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install portrait dependency
        run: python -m pip install "$(sed -n '/^pillow==/p' requirements.txt)"
      - name: Test catalogue synchronization
        run: python -m unittest discover -s tools -p TestGeneratePortraitViewer.py
      - name: Build companion from this revision
        run: python tools/GeneratePortraitViewer.py
      - uses: actions/upload-artifact@v7
        with:
          name: portrait-companion-${{ github.sha }}
          path: portrait-viewer/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - if: vars.PORTRAIT_PAGES == 'true' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: portrait-viewer/

  # Publishing stays off until a maintainer sets the PORTRAIT_PAGES variable.
  pages:
    if: vars.PORTRAIT_PAGES == 'true' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: portrait-pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
