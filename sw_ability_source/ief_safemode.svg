    <path d="M 128 52 L 128 74"/>
    <path d="M 76 82 L 100 82 L 100 100"/>
    <path d="M 180 82 L 156 82 L 156 100"/>
    <path d="M 78 150 L 96 150 L 108 162"/>
    <path d="M 178 150 L 160 150 L 148 162"/>
