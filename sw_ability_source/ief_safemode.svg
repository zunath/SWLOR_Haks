    <circle cx="76" cy="82" r="6"/>
    <circle cx="180" cy="82" r="6"/>
    <circle cx="78" cy="150" r="6"/>
    <circle cx="178" cy="150" r="6"/>
  </g>
  <!-- the check mark -->
  <path d="M 92 126 L 118 154 L 168 94" fill="none" stroke="#10331c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55" filter="url(#soft)"/>
  <path d="M 92 126 L 118 154 L 168 94" fill="none" stroke="#2fc766" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 92 126 L 118 154 L 168 94" fill="none" stroke="url(#check)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
