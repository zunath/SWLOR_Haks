<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#3a1010"/>
      <stop offset="0.55" stop-color="#170606"/>
      <stop offset="1" stop-color="#040101"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6fb"/>
      <stop offset="0.45" stop-color="#aebbca"/>
      <stop offset="1" stop-color="#4a5668"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a74"/>
      <stop offset="0.5" stop-color="#e52a1f"/>
      <stop offset="1" stop-color="#8c0a08"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <path id="sole" d="M0 -290 C100 -290 145 -205 140 -110 C135 -25 92 35 74 85 L80 118 C98 140 104 205 92 250 C80 295 -80 295 -92 250 C-104 205 -98 140 -80 118 L-74 85 C-92 35 -135 -25 -140 -110 C-145 -205 -100 -290 0 -290 Z"/>
    <clipPath id="soleclip"><use xlink:href="#sole"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- the step before, fading -->
  <g transform="translate(250 360) rotate(-24) scale(0.6)">
    <use xlink:href="#sole" fill="#5aa8f0" opacity="0.18"/>
    <use xlink:href="#sole" fill="none" stroke="#8ccaff" stroke-width="26" opacity="0.55" filter="url(#soft)"/>
    <use xlink:href="#sole" fill="none" stroke="#b9e0ff" stroke-width="10" opacity="0.7"/>
  </g>

  <!-- the planted step, cracked -->
  <g transform="translate(470 560) rotate(-12) scale(1.08)">
    <use xlink:href="#sole" fill="#000" opacity="0.6" transform="translate(16 20)" filter="url(#soft)"/>
    <use xlink:href="#sole" fill="url(#steel)"/>
    <g clip-path="url(#soleclip)" fill="none" stroke="#38424f" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M-150 -215 L0 -255 L150 -215" stroke-width="18"/>
      <path d="M-150 -145 L0 -185 L150 -145" stroke-width="18"/>
      <path d="M-150 -75 L0 -115 L150 -75" stroke-width="18"/>
      <path d="M-150 -5 L0 -45 L150 -5" stroke-width="18"/>
      <line x1="-150" y1="102" x2="150" y2="102" stroke-width="22" stroke="#1d232b"/>
      <path d="M-150 175 L0 145 L150 175" stroke-width="16"/>
      <path d="M-150 235 L0 205 L150 235" stroke-width="16"/>
    </g>
    <use xlink:href="#sole" fill="none" stroke="#1a1f27" stroke-width="14"/>
    <ellipse cx="-45" cy="-180" rx="38" ry="80" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>
    <path d="M-60 -280 L-10 -190 L-55 -125 L30 -50 L-15 25 L55 110 L25 170 L70 270"
          fill="none" stroke="#120303" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-60 -280 L-10 -190 L-55 -125 L30 -50 L-15 25 L55 110 L25 170 L70 270"
          fill="none" stroke="#ff4a3c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- falling arrow -->
  <g transform="translate(790 480)">
    <path d="M-55 -260 H55 V70 H140 L0 260 L-140 70 H-55 Z" fill="#ff2a1a" opacity="0.55" filter="url(#glow)"/>
    <path d="M-55 -260 H55 V70 H140 L0 260 L-140 70 H-55 Z" fill="url(#arrow)" stroke="#2e0404" stroke-width="14" stroke-linejoin="round"/>
    <path d="M-30 -240 H0 V80 H-30 Z" fill="#ffd0c6" opacity="0.45"/>
  </g>
</svg>
